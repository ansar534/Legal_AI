# Legal AI Hub — stateless app container. All state lives in managed Azure services:
#
#   PostgreSQL Flexible Server (private IP only)  vectors + upload records
#   Blob Storage (no account keys)                uploaded files
#   Key Vault (RBAC)                              API keys + database password
#
# The container authenticates to all three with the VM's user-assigned managed
# identity, so there is no .env file and no secret in this file or the image.
#
#   VM : az acr login -n legalai && docker compose pull && docker compose up -d --no-build
#   DB : docker compose run --rm app python -m src.db.migrate
#   One-off data import (the export is mounted for that run only):
#        docker compose run --rm -v ~/migration:/migration:ro app \
#          python -m src.db.import_chroma_export /migration/chroma_export.jsonl.gz

services:
  app:
    image: ${REGISTRY:-legalai.azurecr.io}/legal-ai-hub:${TAG:-v2}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: legal-ai-hub
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8501}:8501"
    # Identifiers only. Secret values are read from Key Vault at run time.
    environment:
      AZURE_CLIENT_ID: e2ee396e-3e07-46c0-b8b2-22f8c7d48242
      AZURE_KEY_VAULT_URL: https://kv-legalai-m4.vault.azure.net/
      AZURE_STORAGE_ACCOUNT_URL: https://stlegalaiuploads.blob.core.windows.net/
      AZURE_STORAGE_CONTAINER: uploads
      POSTGRES_HOST: pg-legalai-m4.postgres.database.azure.com
      POSTGRES_DB: legalai
      POSTGRES_USER: legalaiadmin
      POSTGRES_SSLMODE: require
    networks:
      - legal-ai-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  legal-ai-net:
    name: legal-ai-net
    driver: bridge
