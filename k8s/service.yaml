apiVersion: v1
kind: Service
metadata:
  name: legal-ai-hub
  namespace: legal-ai
  annotations:
    # Streamlit keeps each user's session in one process, and file uploads are
    # separate HTTP requests that must reach that same process. A cookie pins
    # each browser to one replica.
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: legal_ai_replica
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legal-ai-hub
  ports:
    - name: http
      port: 80
      targetPort: http
