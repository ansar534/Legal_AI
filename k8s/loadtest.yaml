# Load generator for the autoscaler demo. Not part of kustomization.yaml.
#
#   kubectl apply -f k8s/loadtest.yaml
#   kubectl -n legal-ai get hpa legal-ai-hub --watch
#   kubectl -n legal-ai delete job load-test     # stop early
#
# Four pods each keep 16 requests in flight against the Service for
# DURATION seconds, pushing average CPU past the HPA's 60% target.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: legal-ai
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: load
          image: busybox:1.37
          env:
            - name: DURATION
              value: "240"
            - name: TARGET
              value: http://legal-ai-hub.legal-ai.svc.cluster.local/
          command:
            - sh
            - -c
            - |
              end=$(( $(date +%s) + DURATION ))
              while [ "$(date +%s)" -lt "$end" ]; do
                for i in $(seq 16); do wget -q -O /dev/null "$TARGET" & done
                wait
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 64Mi
