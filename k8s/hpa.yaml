apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legal-ai-hub
  namespace: legal-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legal-ai-hub
  minReplicas: 2
  # Two B2as_v2 nodes; four replicas at 1 GiB requested memory each still
  # leave room for system pods and a rolling-update surge.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
