# Pods run as this Kubernetes service account. Through workload identity
# federation it maps to the Azure managed identity id-legalai-app, which holds
# Key Vault Secrets User, Storage Blob Data Contributor (uploads container) and
# AcrPull. No secret or key is mounted into the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legal-ai-hub
  namespace: legal-ai
  annotations:
    azure.workload.identity/client-id: e2ee396e-3e07-46c0-b8b2-22f8c7d48242
