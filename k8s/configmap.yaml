# Identifiers only. Secret values (API keys, database password) are read from
# Key Vault at run time with the workload identity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: legal-ai-hub-config
  namespace: legal-ai
data:
  AZURE_KEY_VAULT_URL: https://kv-legalai-m4.vault.azure.net/
  AZURE_STORAGE_ACCOUNT_URL: https://stlegalaiuploads.blob.core.windows.net/
  AZURE_STORAGE_CONTAINER: uploads
  POSTGRES_HOST: pg-legalai-m4.postgres.database.azure.com
  POSTGRES_DB: legalai
  POSTGRES_USER: legalaiadmin
  POSTGRES_SSLMODE: require
